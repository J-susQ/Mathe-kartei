<title>Analysis-Kartei</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2445A8">
<!--PWA_HEAD-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>/*KATEX_CSS*/</style>
<style>
/* Layout: eine Spalte, Handy zuerst. Karteikarte auf Karopapier, Bewertungsleiste unten fixiert. */
:root{
  --paper:#EEF1F5; --card:#FFFFFF; --ink:#17202C; --muted:#5A6577; --line:#D5DCE5;
  --grid:rgba(36,69,168,.075); --accent:#2445A8; --accent-soft:#E3E9FA; --on-accent:#FFFFFF;
  --hl:#FFE27A; --hl-ink:#3D3000;
  --bad:#B93A26; --bad-soft:#FBE7E3; --mid:#A86C00; --mid-soft:#FBF0DA; --good:#22744A; --good-soft:#E0F2E8;
  --t-def:#2445A8; --t-satz:#6A3B9E; --t-lemma:#11706F; --t-axiom:#8C5A00; --t-prop:#3E6A28;
  --shadow:0 1px 2px rgba(20,30,50,.06),0 8px 24px rgba(20,30,50,.08);
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-text:"Newsreader","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E131A; --card:#161D27; --ink:#E5EAF1; --muted:#98A3B4; --line:#2A3441;
  --grid:rgba(143,168,255,.06); --accent:#8EA7FF; --accent-soft:#1D2843; --on-accent:#0B1020;
  --hl:#5C4C12; --hl-ink:#FFE9A3;
  --bad:#FF8E7A; --bad-soft:#3A1F1A; --mid:#F3B54A; --mid-soft:#33280F; --good:#6FD39C; --good-soft:#15301F;
  --t-def:#8EA7FF; --t-satz:#C6A2F2; --t-lemma:#62D1CB; --t-axiom:#F0BE5C; --t-prop:#A6D98A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0E131A; --card:#161D27; --ink:#E5EAF1; --muted:#98A3B4; --line:#2A3441;
  --grid:rgba(143,168,255,.06); --accent:#8EA7FF; --accent-soft:#1D2843; --on-accent:#0B1020;
  --hl:#5C4C12; --hl-ink:#FFE9A3;
  --bad:#FF8E7A; --bad-soft:#3A1F1A; --mid:#F3B54A; --mid-soft:#33280F; --good:#6FD39C; --good-soft:#15301F;
  --t-def:#8EA7FF; --t-satz:#C6A2F2; --t-lemma:#62D1CB; --t-axiom:#F0BE5C; --t-prop:#A6D98A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-block:14px 120px;display:flex;flex-direction:column;gap:18px}
.view{display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
.eyebrow{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}

/* Kopf */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.brand{display:flex;flex-direction:column;gap:2px}
.brand h1{font-family:var(--f-text);font-weight:600;font-size:28px;letter-spacing:-.01em}
.brand h1 i{font-style:italic;color:var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:999px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}

/* Level-Kacheln */
.levels{display:flex;flex-direction:column;gap:10px}
.lvl{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px;border-radius:var(--r);
  border:1.5px solid var(--line);background:var(--card);text-align:left;width:100%}
.lvl[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lvl .badge{width:42px;height:42px;border-radius:11px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;
  font-family:var(--f-text);font-weight:600;font-size:22px}
.lvl[aria-pressed="true"] .badge{background:var(--accent);color:var(--on-accent)}
.lvl .t{display:flex;flex-direction:column;gap:5px;min-width:0}
.lvl .t b{font-weight:600;font-size:16px}
.lvl .t span{font-size:12.5px;color:var(--muted)}
.bar{display:flex;height:6px;border-radius:99px;overflow:hidden;background:var(--line)}
.bar i{display:block;height:100%}
.bar .b-good{background:var(--good)}.bar .b-mid{background:var(--mid)}
.lvl .due{font-family:var(--f-num);font-size:13px;text-align:right;color:var(--muted);line-height:1.2}
.lvl .due b{display:block;font-size:20px;color:var(--ink)}

/* Steuerung */
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--paper);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:8px;padding:9px 6px;font-weight:500;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.filterbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--line);background:transparent;border-radius:11px;padding:11px 12px;width:100%;text-align:left}
.filterbtn span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{font-size:12.5px;color:var(--muted)}
.cta{display:flex;flex-direction:column;gap:8px}
.btn{border:0;border-radius:12px;padding:14px 16px;font-weight:600;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:disabled{opacity:.45}
.btn.ghost{background:transparent;border:1px solid var(--line);font-weight:500;font-size:15px;padding:12px}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{font-size:12.5px;color:var(--muted);line-height:1.5}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:7px;height:7px;border-radius:99px;background:var(--muted)}
.sync.on i{background:var(--good)}

/* Lernansicht */
.studybar{display:flex;align-items:center;gap:12px}
.progress{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);transition:width .25s}
.count{font-family:var(--f-num);font-size:13px;color:var(--muted);min-width:56px;text-align:right}
.card{position:relative;background-color:var(--card);border-radius:18px;box-shadow:var(--shadow);border:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:18px 18px;background-position:-1px -1px;padding:18px 18px 20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;
  padding:4px 9px;border-radius:99px;border:1.5px solid currentColor;line-height:1.2;background:var(--card)}
.chip.Definition{color:var(--t-def)}.chip.Satz,.chip.Theorem{color:var(--t-satz)}.chip.Lemma{color:var(--t-lemma)}
.chip.Axiom{color:var(--t-axiom)}.chip.Proposition,.chip.Korollar{color:var(--t-prop)}
.topic{font-size:12.5px;color:var(--muted);min-width:0}
.front{font-family:var(--f-text);font-size:19px;line-height:1.5;min-width:0;overflow-wrap:anywhere}
.front.named{font-size:26px;font-weight:600;line-height:1.25;letter-spacing:-.005em}
.front .ctx{display:block;font-size:16px;font-weight:500;color:var(--muted);margin-top:8px;font-family:var(--f-text)}
.ask{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.ask b{font-family:var(--f-text);font-size:18px;color:var(--accent)}
.reveal{border:1.5px dashed var(--line);border-radius:12px;background:var(--paper);min-height:130px;display:grid;place-items:center;
  color:var(--muted);font-weight:500;width:100%;padding:18px;text-align:center}
.reveal span{display:flex;flex-direction:column;align-items:center;gap:6px}
.reveal svg{width:26px;height:26px;color:var(--accent)}
.back{border-top:1.5px solid var(--line);padding-top:14px;font-family:var(--f-text);font-size:18px;line-height:1.55;min-width:0;overflow-wrap:anywhere;animation:rise .28s ease-out}
.back ol,.back ul,.xtra ol,.xtra ul{margin:.4em 0 .2em;padding-left:1.4em}
.back li{margin:.2em 0}
.back .qed{display:block;text-align:right;color:var(--muted);font-size:15px;margin-top:4px}
.katex-display{overflow-x:auto;overflow-y:hidden;padding:4px 0;margin:.5em 0}
.katex{font-size:1.06em}
@keyframes rise{from{opacity:.25;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.back{animation:none}.progress i{transition:none}}
details.xtra{border:1px solid var(--line);border-radius:12px;background:var(--card);overflow:hidden}
details.xtra summary{padding:11px 13px;font-weight:600;font-size:14px;list-style:none;display:flex;justify-content:space-between;align-items:center;gap:8px}
details.xtra summary::-webkit-details-marker{display:none}
details.xtra summary::after{content:"+";font-family:var(--f-num);color:var(--accent);font-size:18px}
details.xtra[open] summary::after{content:"–"}
details.xtra div{padding:0 13px 13px;font-family:var(--f-text);font-size:16.5px;line-height:1.55}
.flag{background:var(--hl);color:var(--hl-ink);border-radius:12px;padding:10px 12px;font-size:13.5px;line-height:1.45;display:flex;gap:8px}
.flag b{flex:none}

.ratebar{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ratebar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.ratebar .in.one{grid-template-columns:1fr}
.rate{border:1.5px solid transparent;border-radius:12px;padding:10px 4px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;font-size:14px}
.rate small{font-family:var(--f-num);font-weight:500;font-size:11.5px;opacity:.8}
.rate.r0{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.rate.r1{background:var(--mid-soft);color:var(--mid);border-color:color-mix(in srgb,var(--mid) 35%,transparent)}
.rate.r2{background:var(--good-soft);color:var(--good);border-color:color-mix(in srgb,var(--good) 35%,transparent)}

/* Ende */
.done{text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;padding:28px 8px}
.done h2{font-family:var(--f-text);font-size:28px}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.tally div{border-radius:12px;padding:12px 6px;display:flex;flex-direction:column;gap:2px}
.tally b{font-family:var(--f-num);font-size:24px}
.tally span{font-size:12px}

/* Liste */
.search{width:100%;border:1px solid var(--line);background:var(--card);border-radius:11px;padding:11px 12px;font:inherit;color:var(--ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.item>button{width:100%;text-align:left;border:0;background:transparent;padding:12px 13px;display:flex;flex-direction:column;gap:6px}
.item .ttl{font-family:var(--f-text);font-size:17px;line-height:1.35;min-width:0;overflow-wrap:anywhere}
.item .sub{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.item .body{padding:0 13px 13px;display:flex;flex-direction:column;gap:10px;font-family:var(--f-text);font-size:16.5px;line-height:1.55;overflow-wrap:anywhere}
.st{font-family:var(--f-num);font-size:11px;padding:2px 7px;border-radius:99px;border:1px solid var(--line)}
.st.new{color:var(--muted)}.st.learn{color:var(--mid);border-color:currentColor}.st.firm{color:var(--good);border-color:currentColor}
.backlink{display:flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);font-weight:600;padding:6px 0}

/* Blatt (Filter, Info) */
.scrim{position:fixed;inset:0;background:rgba(8,12,20,.45);z-index:20}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--card);border-radius:20px 20px 0 0;max-height:88%;overflow:auto;
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-shadow:0 -8px 30px rgba(0,0,0,.25)}
.sheet .in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.grab{width:40px;height:5px;border-radius:99px;background:var(--line);margin:4px auto 4px}
.sheet h2{font-family:var(--f-text);font-size:22px}
.sheet h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.tog{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:7px 12px;font-size:13.5px;font-weight:500}
.tog[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:transparent;font-size:18px}
.stepper b{font-family:var(--f-num);min-width:28px;text-align:center}
.prose{font-size:14.5px;line-height:1.6;display:flex;flex-direction:column;gap:10px}
.prose p{margin:0}
.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,transparent)!important}
</style>

<div id="sheetroot"></div>

<script>
const CARDS = /*CARDS*/;
</script>
<script>
(function(){
"use strict";
const DAY=864e5, MIN=6e4;
const LEVELS=[
  {n:1,title:"Meine Mindmap",sub:"Deine Zusammenfassung: Grundlagen bis Bolzano-Weierstraß"},
  {n:2,title:"Analysis 1",sub:"Folgen, Reihen, Stetigkeit, Ableitung, Integral"},
  {n:3,title:"Analysis 2",sub:"Topologie, Differentialrechnung im ℝⁿ, DGL, Integration"}];
const TYPES=["Definition","Axiom","Satz","Theorem","Lemma","Proposition","Korollar"];
const LS_KEY="analysis-kartei-v1";

/* ---------- Zustand ---------- */
const defaults={level:1,reverse:false,newPer:15,filters:{1:{types:[],topics:[],unsure:false},2:{types:[],topics:[],unsure:false},3:{types:[],topics:[],unsure:false}}};
let S={settings:JSON.parse(JSON.stringify(defaults)),cards:{},updatedAt:0};
function lsLoad(){try{const raw=localStorage.getItem(LS_KEY);if(raw){const o=JSON.parse(raw);if(o&&typeof o==="object")return o}}catch(e){}return null}
function lsSave(){try{localStorage.setItem(LS_KEY,JSON.stringify(S))}catch(e){}}
function sane(o){
  const out={settings:JSON.parse(JSON.stringify(defaults)),cards:{},updatedAt:+o.updatedAt||0};
  const s=o.settings||{};
  if([1,2,3].includes(s.level))out.settings.level=s.level;
  out.settings.reverse=!!s.reverse;
  if(Number.isFinite(s.newPer))out.settings.newPer=Math.min(50,Math.max(0,Math.round(s.newPer)));
  for(const l of [1,2,3]){const f=(s.filters||{})[l]||{};
    out.settings.filters[l]={types:Array.isArray(f.types)?f.types.filter(t=>TYPES.includes(t)):[],topics:Array.isArray(f.topics)?f.topics.filter(t=>typeof t==="string"):[],unsure:!!f.unsure}}
  const c=o.cards||{};for(const k in c){const v=c[k];if(!v||typeof v!=="object"||!/^[123]-[0-9a-f]{8}(:r)?$/.test(k))continue;
    out.cards[k]={r:+v.r||0,i:+v.i||0,e:+v.e||2.5,d:+v.d||0,t:+v.t||0,l:+v.l||0}}
  return out}
function merge(a,b){ // pro Karte gewinnt die jüngere Wiederholung
  const out=(a.updatedAt>=b.updatedAt)?sane(a):sane(b);const other=(a.updatedAt>=b.updatedAt)?sane(b):sane(a);
  for(const k in other.cards){if(!out.cards[k]||other.cards[k].t>out.cards[k].t)out.cards[k]=other.cards[k]}
  out.updatedAt=Math.max(a.updatedAt||0,b.updatedAt||0);return out}
const ls=lsLoad();if(ls)S=sane(ls);

/* Sync über die Artifact-Datenbank (falls verfügbar) */
let db=null,docRef=null,syncOn=false,writeTimer=null,writing=false,pending=false;
async function initSync(){
  try{
    if(!window.claude||typeof window.claude.use!=="function")return;
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    if(!d||!u)return;
    const id=await u.id();if(!id)return;
    db=d;docRef=db.doc("data/users/"+id+"/progress");
    const snap=await Promise.race([docRef.get(),new Promise((_,rej)=>setTimeout(()=>rej(new Error("timeout")),10000))]);
    if(snap&&snap.exists){const remote=snap.data()||{};let parsed=null;try{parsed=JSON.parse(remote.state||"null")}catch(e){}
      if(parsed){S=merge(S,parsed);lsSave()}}
    syncOn=true;render();
    if(!snap||!snap.exists)queueWrite();
  }catch(e){syncOn=false;render()}
}
function queueWrite(){if(!docRef)return;clearTimeout(writeTimer);writeTimer=setTimeout(flush,2500)}
async function flush(){if(!docRef)return;if(writing){pending=true;return}writing=true;
  try{await docRef.set({state:JSON.stringify(S),updatedAt:S.updatedAt});syncOn=true}catch(e){syncOn=false}
  writing=false;if(pending){pending=false;flush()}updateSyncBadge()}
function persist(){S.updatedAt=Date.now();lsSave();queueWrite()}

/* ---------- Karten ---------- */
const byLevel={1:[],2:[],3:[]};CARDS.forEach(c=>byLevel[c.lvl].push(c));
const topicsOf=l=>[...new Set(byLevel[l].map(c=>c.topic))];
const typesOf=l=>TYPES.filter(t=>byLevel[l].some(c=>c.type===t));
const key=c=>c.id+(S.settings.reverse?":r":"");
const st=k=>S.cards[k];
function statusOf(k){const s=st(k);if(!s||!s.t)return"new";return s.i>=7?"firm":"learn"}
function pool(l){
  const f=S.settings.filters[l];let arr=byLevel[l];
  if(f.types.length)arr=arr.filter(c=>f.types.includes(c.type));
  if(f.topics.length)arr=arr.filter(c=>f.topics.includes(c.topic));
  if(f.unsure)arr=arr.filter(c=>c.flag);
  if(S.settings.reverse)arr=arr.filter(c=>c.name);
  return arr}
function counts(l){const now=Date.now();let due=0,neu=0,firm=0,learn=0;
  for(const c of pool(l)){const s=st(key(c));if(!s||!s.t)neu++;else{if(s.d<=now)due++;if(s.i>=7)firm++;else learn++}}
  return{due,neu,firm,learn,total:pool(l).length}}

/* Wiederholungslogik (vereinfachtes SM-2) */
function schedule(s,g){s=s?{...s}:{r:0,i:0,e:2.5,d:0,t:0,l:0};const now=Date.now();
  if(g===0){s.r=0;s.l++;s.e=Math.max(1.3,s.e-.2);s.i=0;s.d=now+10*MIN}
  else if(g===1){s.e=Math.max(1.3,s.e-.15);s.i=s.r===0?1:Math.max(1,Math.round(s.i*1.2));s.r++;s.d=now+s.i*DAY}
  else{s.i=s.r===0?2:(s.r===1?5:Math.max(s.i+1,Math.round(s.i*s.e)));s.e=Math.min(3,s.e+.05);s.r++;s.d=now+s.i*DAY}
  s.t=now;return s}
function fmtInt(s){if(s.i===0)return"10 min";if(s.i<30)return s.i+(s.i===1?" Tag":" Tage");const m=Math.round(s.i/30);return m+(m===1?" Monat":" Monate")}

/* ---------- Mathe ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
function tex(src){ // Kartentext ist eigenes HTML mit $…$ / $$…$$
  if(!src)return"";const K=window.katex;
  return src.replace(/\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g,(m,d,i)=>{const t=d||i;
    if(!K)return"<code>"+esc(t)+"</code>";
    try{return K.renderToString(t,{displayMode:!!d,throwOnError:false,output:"html"})}catch(e){return"<code>"+esc(t)+"</code>"}})}
const plain=s=>(s||"").replace(/<[^>]+>/g," ").replace(/\$\$?/g,"").replace(/\\[a-zA-Z]+/g," ").replace(/[{}_^]/g,"").toLowerCase();

/* ---------- Icons ---------- */
const I={
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5" stroke-linecap="round"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  eye:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg>',
  sliders:'<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'};

/* ---------- Ansichten ---------- */
const app=document.getElementById("app"),sheetroot=document.getElementById("sheetroot");
let view="home",session=null,browseOpen=new Set(),searchQ="";

function render(){if(view!=="study")setRatebar(null);({home:renderHome,study:renderStudy,done:renderDone,browse:renderBrowse})[view]();}

function filterSummary(l){const f=S.settings.filters[l];const p=[];
  p.push(f.types.length?f.types.join(", "):"Alle Typen");
  p.push(f.topics.length?(f.topics.length===1?f.topics[0]:f.topics.length+" Themen"):"alle Themen");
  if(f.unsure)p.push("nur unsichere Lesungen");return p.join(" · ")}

function renderHome(){
  const L=S.settings.level;const cs=counts(L);const nNew=Math.min(cs.neu,S.settings.newPer);
  let h=`<header class="top"><div class="brand"><span class="eyebrow">Karteikarten</span><h1>Analysis-<i>Kartei</i></h1></div>
    <button class="iconbtn" id="b-info" aria-label="Info und Einstellungen">${I.info}</button></header>
  <section class="levels" aria-label="Level wählen">`;
  for(const lv of LEVELS){const c=counts(lv.n);const tot=Math.max(1,c.total);
    h+=`<button class="lvl" data-lvl="${lv.n}" aria-pressed="${lv.n===L}">
      <span class="badge">${lv.n}</span>
      <span class="t"><b>${lv.title}</b><span>${lv.sub}</span>
        <span class="bar" aria-label="${c.firm} gefestigt, ${c.learn} in Arbeit von ${c.total}"><i class="b-good" style="width:${c.firm/tot*100}%"></i><i class="b-mid" style="width:${c.learn/tot*100}%"></i></span></span>
      <span class="due"><b>${c.due}</b>fällig</span></button>`}
  h+=`</section>
  <section class="panel">
    <div class="seg" role="group" aria-label="Abfragerichtung">
      <button id="m-norm" aria-pressed="${!S.settings.reverse}">Name → Aussage</button>
      <button id="m-rev" aria-pressed="${S.settings.reverse}">Aussage → Name</button></div>
    ${S.settings.reverse?'<p class="hint">Umgekehrt: Du siehst die Aussage und nennst den Namen. Hier kommen nur Karten mit Namen dran.</p>':''}
    <button class="filterbtn" id="b-filter"><span>${esc(filterSummary(L))}</span>${I.sliders}</button>
    <div class="row hint"><span class="num">${cs.total} Karten · ${cs.firm} gefestigt · ${cs.learn} in Arbeit · ${cs.neu} neu</span></div>
  </section>
  <section class="cta">
    <button class="btn primary" id="b-learn" ${cs.due+nNew===0?"disabled":""}>Lernen <span class="num" style="font-weight:500;opacity:.85">${cs.due} fällig + ${nNew} neu</span></button>
    ${cs.due+nNew===0?'<p class="hint" style="text-align:center">Für heute ist nichts fällig. Freies Üben geht immer.</p>':''}
    <div class="btn-row"><button class="btn ghost" id="b-free">Freies Üben</button><button class="btn ghost" id="b-browse">Alle Karten</button></div>
  </section>
  <p class="note"><span class="sync ${syncOn?"on":""}" id="syncb"><i></i>${syncOn?"Fortschritt in deinem Konto gesichert":"Fortschritt auf diesem Gerät gespeichert"}</span></p>`;
  app.innerHTML=`<div class="view">${h}</div>`;
  app.querySelectorAll(".lvl").forEach(b=>b.onclick=()=>{S.settings.level=+b.dataset.lvl;persist();render()});
  app.querySelector("#m-norm").onclick=()=>{S.settings.reverse=false;persist();render()};
  app.querySelector("#m-rev").onclick=()=>{S.settings.reverse=true;persist();render()};
  app.querySelector("#b-filter").onclick=openFilter;
  app.querySelector("#b-info").onclick=openInfo;
  app.querySelector("#b-learn").onclick=()=>startSession(false);
  app.querySelector("#b-free").onclick=()=>startSession(true);
  app.querySelector("#b-browse").onclick=()=>{view="browse";searchQ="";browseOpen.clear();render();scrollTo(0,0)};
}
function updateSyncBadge(){const b=document.getElementById("syncb");if(b){b.className="sync"+(syncOn?" on":"");b.lastChild.textContent=syncOn?"Fortschritt in deinem Konto gesichert":"Fortschritt auf diesem Gerät gespeichert"}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startSession(free){
  const L=S.settings.level,now=Date.now();let q;
  if(free)q=shuffle(pool(L).slice());
  else{const due=pool(L).filter(c=>{const s=st(key(c));return s&&s.t&&s.d<=now}).sort((a,b)=>st(key(a)).d-st(key(b)).d);
    const neu=pool(L).filter(c=>{const s=st(key(c));return!s||!s.t}).slice(0,S.settings.newPer);q=due.concat(neu)}
  if(!q.length)return;
  session={q,pos:0,revealed:false,tally:[0,0,0],total:q.length,free};view="study";render();scrollTo(0,0)}

function cardFace(c,rev){
  if(!rev){
    if(c.name)return`<div class="front named">${tex(c.name)}${c.front?`<span class="ctx">${tex(c.front)}</span>`:""}</div><div class="ask">Wie lautet die Aussage?</div>`;
    return`<div class="front">${tex(c.front)}</div><div class="ask"><b>⇒</b> Was folgt?</div>`}
  return`<div class="front">${tex(c.back)}</div><div class="ask">Wie heißt dieses Resultat?</div>`}
function cardBack(c,rev){
  if(!rev)return tex(c.back)+'<span class="qed" aria-hidden="true">□</span>';
  return`<div style="font-weight:600;font-size:22px">${tex(c.name)}</div>${c.front?`<div class="muted" style="font-size:16px;margin-top:6px">${tex(c.front)}</div>`:""}`}
function extras(c){let h="";
  if(c.extra)h+=`<details class="xtra"><summary>Beweisidee · Beispiel</summary><div>${tex(c.extra)}</div></details>`;
  if(c.flag)h+=`<div class="flag"><b>Lesung prüfen:</b><span>${tex(c.flag)}</span></div>`;return h}

function renderStudy(){
  const s=session,c=s.q[s.pos],rev=S.settings.reverse;const k=key(c);
  const pct=s.pos/Math.max(1,s.q.length)*100;
  let h=`<div class="studybar"><button class="iconbtn" id="b-close" aria-label="Runde beenden">${I.x}</button>
    <div class="progress" aria-hidden="true"><i style="width:${pct}%"></i></div><span class="count">${s.pos+1} / ${s.q.length}</span></div>
  <article class="card">
    <div class="meta"><span class="chip ${c.type}">${c.type}</span><span class="topic">${esc(c.topic)}</span></div>
    ${cardFace(c,rev)}
    ${s.revealed?`<div class="back">${cardBack(c,rev)}</div>`:`<button class="reveal" id="b-reveal"><span>${I.eye}Aufdecken</span></button>`}
  </article>
  ${s.revealed?extras(c):""}`;
  app.innerHTML=`<div class="view">${h}</div>`;
  app.querySelector("#b-close").onclick=()=>{session.pos>0?finish():(view="home",render())};
  const rb=document.getElementById("ratebar");
  if(!s.revealed){app.querySelector("#b-reveal").onclick=()=>{s.revealed=true;render()};
    setRatebar(`<div class="in one"><button class="btn primary" id="b-rev2">Aufdecken</button></div>`);
    document.getElementById("b-rev2").onclick=()=>{s.revealed=true;render()};}
  else{const p=[0,1,2].map(g=>fmtInt(schedule(st(k),g)));
    setRatebar(`<div class="in">
      <button class="rate r0" data-g="0">Nicht gewusst<small>${p[0]}</small></button>
      <button class="rate r1" data-g="1">Teilweise<small>${p[1]}</small></button>
      <button class="rate r2" data-g="2">Gewusst<small>${p[2]}</small></button></div>`);
    document.querySelectorAll(".rate").forEach(b=>b.onclick=()=>rate(+b.dataset.g));}
}
function setRatebar(html){let rb=document.getElementById("ratebar");
  if(html===null){if(rb)rb.remove();return}
  if(!rb){rb=document.createElement("div");rb.id="ratebar";rb.className="ratebar";document.body.appendChild(rb)}
  rb.innerHTML=html}
function rate(g){const s=session,c=s.q[s.pos],k=key(c);
  S.cards[k]=schedule(st(k),g);s.tally[g]++;persist();
  if(g===0){const at=Math.min(s.q.length,s.pos+4);s.q.splice(at,0,c)} // kommt in dieser Runde noch einmal
  s.pos++;s.revealed=false;
  if(s.pos>=s.q.length)finish();else{render();scrollTo(0,0)}}
function finish(){view="done";render();scrollTo(0,0)}
function renderDone(){setRatebar(null);const t=session.tally;const L=S.settings.level;const c=counts(L);
  app.innerHTML=`<div class="view"><div class="done"><span class="eyebrow">Level ${L} · Runde beendet</span><h2>Gut gemacht.</h2>
    <div class="tally"><div style="background:var(--good-soft);color:var(--good)"><b>${t[2]}</b><span>gewusst</span></div>
    <div style="background:var(--mid-soft);color:var(--mid)"><b>${t[1]}</b><span>teilweise</span></div>
    <div style="background:var(--bad-soft);color:var(--bad)"><b>${t[0]}</b><span>nicht gewusst</span></div></div>
    <p class="muted">Noch fällig: <span class="num">${c.due}</span> · gefestigt: <span class="num">${c.firm} von ${c.total}</span></p>
    <button class="btn primary" id="b-home">Zur Übersicht</button></div></div>`;
  app.querySelector("#b-home").onclick=()=>{view="home";render()}}

function renderBrowse(){setRatebar(null);const L=S.settings.level;const q=searchQ.trim().toLowerCase();
  let arr=pool(L);if(q)arr=arr.filter(c=>plain(c.name+" "+c.front+" "+c.back+" "+c.topic).includes(q));
  const stLabel={new:"neu",learn:"in Arbeit",firm:"gefestigt"};
  let h=`<button class="backlink" id="b-back">${I.back}Übersicht</button>
  <div><span class="eyebrow">Level ${L} · ${LEVELS[L-1].title}</span><h2 style="font-family:var(--f-text);font-size:24px">Alle Karten</h2></div>
  <input class="search" id="q" type="search" placeholder="Suchen, z. B. Cauchy" value="${esc(searchQ)}" autocomplete="off">
  <button class="filterbtn" id="b-filter"><span>${esc(filterSummary(L))}</span>${I.sliders}</button>
  <p class="hint num">${arr.length} Karten</p><div class="list">`;
  let lastTopic="";
  for(const c of arr){const k=key(c);const s=statusOf(k);const open=browseOpen.has(c.id);
    if(c.topic!==lastTopic){h+=`<div class="eyebrow" style="margin-top:8px">${esc(c.topic)}</div>`;lastTopic=c.topic}
    h+=`<div class="item"><button data-id="${c.id}" aria-expanded="${open}"><span class="ttl">${tex(c.name||c.front)}</span>
      <span class="sub"><span class="chip ${c.type}" style="font-size:10px;padding:2px 7px">${c.type}</span><span class="st ${s}">${stLabel[s]}</span>${c.flag?'<span class="st" style="background:var(--hl);color:var(--hl-ink);border-color:transparent">Lesung prüfen</span>':""}</span></button>
      ${open?`<div class="body">${c.name&&c.front?`<div class="muted">${tex(c.front)}</div>`:""}<div>${tex(c.back)}</div>${extras(c)}</div>`:""}</div>`}
  h+=`</div>`;
  app.innerHTML=`<div class="view">${h}</div>`;
  app.querySelector("#b-back").onclick=()=>{view="home";render();scrollTo(0,0)};
  app.querySelector("#b-filter").onclick=openFilter;
  const inp=app.querySelector("#q");let tm;inp.oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>{searchQ=inp.value;const pos=inp.selectionStart;render();const n=app.querySelector("#q");n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}},200)};
  app.querySelectorAll(".item>button").forEach(b=>b.onclick=()=>{const id=b.dataset.id;browseOpen.has(id)?browseOpen.delete(id):browseOpen.add(id);render()});
}

/* ---------- Blätter ---------- */
function openSheet(html,bind){sheetroot.innerHTML=`<div class="scrim" id="scrim"></div><div class="sheet" role="dialog" aria-modal="true"><div class="in"><div class="grab"></div>${html}</div></div>`;
  document.getElementById("scrim").onclick=closeSheet;bind(sheetroot)}
function closeSheet(){sheetroot.innerHTML="";render()}
function openFilter(){const L=S.settings.level;const f=S.settings.filters[L];
  const draw=()=>{const types=typesOf(L),topics=topicsOf(L);
    openSheet(`<div class="row"><h2>Filter · Level ${L}</h2><button class="iconbtn" id="s-x" aria-label="Schließen">${I.x}</button></div>
      <div><h3>Typ</h3><div class="chips" style="margin-top:8px">${types.map(t=>`<button class="tog" data-type="${t}" aria-pressed="${f.types.includes(t)}">${t}</button>`).join("")}</div></div>
      <div><h3>Thema</h3><div class="chips" style="margin-top:8px">${topics.map(t=>`<button class="tog" data-topic="${esc(t)}" aria-pressed="${f.topics.includes(t)}">${esc(t)}</button>`).join("")}</div></div>
      ${L===1?`<div><h3>Gegenlesen</h3><div class="chips" style="margin-top:8px"><button class="tog" id="s-uns" aria-pressed="${f.unsure}">Nur Karten mit „Lesung prüfen“</button></div></div>`:""}
      <div class="row"><div><h3>Neue Karten pro Runde</h3></div><div class="stepper"><button id="s-m" aria-label="weniger">−</button><b>${S.settings.newPer}</b><button id="s-p" aria-label="mehr">+</button></div></div>
      <p class="hint">Keine Auswahl bedeutet: alle. Aktuell <span class="num">${pool(L).length}</span> Karten.</p>
      <div class="btn-row"><button class="btn ghost" id="s-reset">Zurücksetzen</button><button class="btn primary" id="s-ok">Fertig</button></div>`,
    r=>{r.querySelector("#s-x").onclick=closeSheet;r.querySelector("#s-ok").onclick=closeSheet;
      r.querySelectorAll("[data-type]").forEach(b=>b.onclick=()=>{const t=b.dataset.type;f.types=f.types.includes(t)?f.types.filter(x=>x!==t):f.types.concat(t);persist();draw()});
      r.querySelectorAll("[data-topic]").forEach(b=>b.onclick=()=>{const t=b.dataset.topic;f.topics=f.topics.includes(t)?f.topics.filter(x=>x!==t):f.topics.concat(t);persist();draw()});
      const u=r.querySelector("#s-uns");if(u)u.onclick=()=>{f.unsure=!f.unsure;persist();draw()};
      r.querySelector("#s-m").onclick=()=>{S.settings.newPer=Math.max(0,S.settings.newPer-5);persist();draw()};
      r.querySelector("#s-p").onclick=()=>{S.settings.newPer=Math.min(50,S.settings.newPer+5);persist();draw()};
      r.querySelector("#s-reset").onclick=()=>{f.types=[];f.topics=[];f.unsure=false;persist();draw()};})};
  draw()}
function openInfo(){let armed=false;const L=S.settings.level;
  const draw=()=>openSheet(`<div class="row"><h2>So funktioniert's</h2><button class="iconbtn" id="s-x" aria-label="Schließen">${I.x}</button></div>
    <div class="prose">
      <p><b>Karten.</b> Hat ein Resultat einen Namen, siehst du den Namen und rufst dir die Aussage ins Gedächtnis. Ohne Namen siehst du die Voraussetzung und überlegst, was folgt. Dann deckst du auf.</p>
      <p><b>Wiederholung.</b> Nach dem Aufdecken bewertest du dich. „Gewusst“ schiebt die Karte weiter in die Zukunft (2, 5, dann etwa 12 Tage und mehr), „Teilweise“ nur ein wenig, „Nicht gewusst“ holt sie in derselben Runde noch einmal und morgen wieder. Ab 7 Tagen Abstand gilt eine Karte als gefestigt.</p>
      <p><b>Level 1</b> stammt aus deiner handschriftlichen Mindmap. Wo die Handschrift unklar war oder ich etwas ergänzt habe, steht auf der Karte „Lesung prüfen“. Im Filter kannst du genau diese Karten anzeigen.</p>
      <p><b>Level 2 und 3</b> folgen dem Standardkanon nach Forster (Analysis 1 und 2) und Königsberger (Analysis 1 und 2). Level 3 enthält auch die Grundzüge der mehrdimensionalen Integration, die an manchen Unis erst in Analysis 3 kommt.</p>
      <p><b>Speicherung.</b> ${syncOn?"Dein Fortschritt wird in deinem Claude-Konto gesichert und zusätzlich auf diesem Gerät.":"Dein Fortschritt liegt auf diesem Gerät. Wenn du angemeldet bist, wird er zusätzlich in deinem Claude-Konto gesichert."}</p>
    </div>
    <button class="btn ghost danger" id="s-reset">${armed?`Wirklich löschen? Tippe noch einmal`:`Fortschritt in Level ${L} zurücksetzen`}</button>`,
  r=>{r.querySelector("#s-x").onclick=closeSheet;r.querySelector("#s-reset").onclick=()=>{
      if(!armed){armed=true;draw();return}
      for(const k of Object.keys(S.cards))if(k.startsWith(L+"-"))delete S.cards[k];persist();closeSheet()}});
  draw()}

document.addEventListener("keydown",e=>{if(view!=="study"||sheetroot.innerHTML)return;
  if(!session.revealed&&(e.key===" "||e.key==="Enter")){e.preventDefault();session.revealed=true;render()}
  else if(session.revealed&&["1","2","3"].includes(e.key))rate(+e.key-1)});

render();
initSync();
/*PWA_SW*/
})();
</script>
